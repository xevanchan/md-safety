[project]
name = "md-safety"
version = "0.1.0"
description = "TODO: one-line description of md-safety"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
md-safety = "md_safety.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_safety"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
